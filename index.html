<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chatbot SST</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .chat-container {
      width: 90%;
      max-width: 650px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      overflow: hidden;
    }

    .header {
      background: #17212b;
      color: white;
      padding: 24px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
    }

    .header p {
      margin: 8px 0 0;
      font-size: 14px;
      opacity: 0.85;
    }

    #chat {
      height: 420px;
      overflow-y: auto;
      padding: 20px;
      background: #f8f9fa;
    }

    .mensaje {
      margin-bottom: 15px;
      padding: 12px 16px;
      border-radius: 14px;
      max-width: 85%;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .usuario {
      background: #17212b;
      color: white;
      margin-left: auto;
    }

    .bot {
      background: #e9ecef;
      color: #222;
      margin-right: auto;
    }

    .entrada {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #ddd;
      background: white;
    }

    #mensaje {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    button {
      border: none;
      background: #ff7a00;
      color: white;
      padding: 13px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

<div class="chat-container">

  <div class="header">
    <h1>👷 Chatbot SST</h1>
    <p>Consulta información de Seguridad y Salud en el Trabajo</p>
  </div>

  <div id="chat">
    <div class="mensaje bot">
      Hola 👋 Soy tu asistente de SST.

      Puedes hacerme una pregunta sobre los documentos cargados.
    </div>
  </div>

  <div class="entrada">
    <input
      id="mensaje"
      type="text"
      placeholder="Escribe tu pregunta..."
    >

    <button id="botonEnviar" onclick="enviarMensaje()">
      Enviar
    </button>
  </div>

</div>

<script>

  // AQUÍ COLOCAREMOS LA PRODUCTION URL DE N8N
  const WEBHOOK_URL = "https://romerolagoserikapaola.app.n8n.cloud/webhook/chatbot-sst-docs";

  async function enviarMensaje() {

    const input = document.getElementById("mensaje");
    const boton = document.getElementById("botonEnviar");
    const chat = document.getElementById("chat");

    const texto = input.value.trim();

    if (!texto) return;

    agregarMensaje(texto, "usuario");

    input.value = "";
    boton.disabled = true;
    boton.textContent = "Consultando...";

    try {

      const respuesta = await fetch(WEBHOOK_URL, {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          mensaje: texto
        })

      });

      if (!respuesta.ok) {
        throw new Error("Error HTTP: " + respuesta.status);
      }

      const tipo = respuesta.headers.get("content-type") || "";

      let resultado;

      if (tipo.includes("application/json")) {
        resultado = await respuesta.json();
      } else {
        resultado = await respuesta.text();
      }

      let respuestaBot;

      if (typeof resultado === "string") {
        respuestaBot = resultado;
      } else {
        respuestaBot =
          resultado.respuesta ||
          resultado.output ||
          resultado.text ||
          resultado.message ||
          JSON.stringify(resultado);
      }

      agregarMensaje(respuestaBot, "bot");

    } catch (error) {

      console.error(error);

      agregarMensaje(
        "No pude conectarme con el asistente. Revisa la configuración del webhook.",
        "bot"
      );

    } finally {

      boton.disabled = false;
      boton.textContent = "Enviar";
      input.focus();

    }
  }


  function agregarMensaje(texto, tipo) {

    const chat = document.getElementById("chat");

    const div = document.createElement("div");

    div.className = "mensaje " + tipo;
    div.textContent = texto;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
  }


  document
    .getElementById("mensaje")
    .addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        enviarMensaje();
      }

    });

</script>

</body>
</html>
